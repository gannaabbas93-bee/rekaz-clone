<section class="hero-root">
  <div class="bg-warm-gradient"></div>
  <div class="bg-dot-grid"></div>
  <div class="bg-blob bg-blob-a"></div>
  <div class="bg-blob bg-blob-b"></div>
  <div class="bg-blob bg-blob-c"></div>
  <div class="hero-container">
    <div class="hero-split">
      <div class="visual-col">
        <div class="visual-float-layer">
          <div class="visual-inner">
            <div class="mockup-glow"></div>
            <div class="mockup-depth-card"></div>
            <div class="mockup-frame">
              <img class="mockup-img" src="https://rekaz.io/home/_assets/Rekaz_en.DWclXL8y.gif" alt="Rekaz main interface preview" loading="eager">
            </div>
            <div class="float-badge badge-top">
              <span class="live-dot"></span>
              <span>{{ ts.t().hero.badgeBookings }}</span>
            </div>
            <div class="float-badge badge-bottom">
              <span class="badge-emoji">💰</span>
              <span>{{ ts.t().hero.badgeRevenue }}</span>
            </div>
          </div>
        </div>
      </div>
      <div class="content-col">
        <h1 class="hero-headline">
          {{ ts.t().hero.headlinePrefix }}
          <span class="dyn-word-wrap">
            <span class="dyn-word" [class.is-hidden]="isHidden">{{ currentWord }}</span>
          </span>
        </h1>
        <p class="hero-desc">{{ ts.t().hero.description }}</p>
        <div class="cta-group">
          <a href="#booking" class="navbar__cta hero-cta-btn">
            <span>{{ ts.t().hero.tryRekaz }}</span>
            <span class="arrow" [class.rtl-arrow]="ts.currentLang() === 'ar'">&rarr;</span>
          </a>
        </div>
        <div class="trust-block">
          <div class="trust-avatars">
            <span class="tav tav-1">A</span>
            <span class="tav tav-2">N</span>
            <span class="tav tav-3">M</span>
            <span class="tav tav-4">S</span>
            <span class="tav tav-5">R</span>
          </div>
          <div class="trust-vline"></div>
          <div class="trust-info">
            <span class="trust-count">{{ ts.t().hero.trustBusinesses }}</span>
            <div class="trust-rating">
              <span class="trust-stars">★★★★★</span>
              <span class="trust-score">{{ ts.t().hero.score }}</span>
              <span class="trust-dot">·</span>
              <span class="trust-label">{{ ts.t().hero.noCommission }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
